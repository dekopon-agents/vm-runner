name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo run --locked --bin vm-runnerd -- check --config examples/vm-runner.yaml
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      - run: cargo machete
      - run: cargo deny --all-features --locked check

  conformance:
    name: OTLP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZO_ROOT_USER_EMAIL: ci@example.com
      ZO_ROOT_USER_PASSWORD: 'Conformance-Only-123!'
    services:
      openobserve:
        image: openobserve/openobserve:v1.0.4@sha256:d4a878fac1f6c56003764f7f2a1625668917388f167e222c8c810de3f54c56ba
        env:
          ZO_ROOT_USER_EMAIL: ci@example.com
          ZO_ROOT_USER_PASSWORD: 'Conformance-Only-123!'
          ZO_TELEMETRY: 'false'
        ports:
          - 5080:5080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: cargo build --locked --bin vm-runnerd
      # GitHub services cannot supply the `run` argument required by Quickwit's entrypoint.
      - name: Start Quickwit service
        run: >-
          docker run --detach --name conformance-quickwit
          --publish 127.0.0.1:7280:7280 --publish 127.0.0.1:7281:7281
          --env QW_ENABLE_OTLP_ENDPOINT=true
          quickwit/quickwit:0.8.2@sha256:363ff56ce45614e46eba1c308e420f56a9f2fd8ab5788cbca0ec6b68a2e0ef92 run
      - name: Assert HTTP/protobuf and gRPC traces in search
        run: python3 ci/otlp_conformance.py --artifacts "$RUNNER_TEMP/conformance"
      - name: Service evidence and cleanup
        if: always()
        run: |
          docker logs '${{ job.services.openobserve.id }}'
          if docker container inspect conformance-quickwit >/dev/null 2>&1; then
            docker logs conformance-quickwit
            docker rm --force conformance-quickwit
          fi
          if test -d "$RUNNER_TEMP/conformance"; then
            find "$RUNNER_TEMP/conformance" -name '*.log' -exec cat {} +
          fi
