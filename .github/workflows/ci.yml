name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      # The guest's init; the orphan-reaping test runs the agent under it.
      - run: sudo apt-get update && sudo apt-get install -y tini
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      # A normal hosted runner cannot write its cgroup tree. Exercise the actual guest
      # attach/measure/move/rmdir path at the kernel cgroup root, not a tempdir fake.
      # A namespace-relative root is NOT exempt from v2's no-internal-process rule;
      # this job uses the disposable runner's actual root, like the Firecracker guest.
      - name: Exercise guest cgroup v2 descendant persistence
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          cargo test --all-features --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/guest-test-build.jsonl"
          guest_test=$(python3 -c 'import json,sys; print(next(x["executable"] for x in map(json.loads,open(sys.argv[1])) if x.get("target",{}).get("name")=="vm_runner" and "lib" in x.get("target",{}).get("kind",[]) and x.get("executable")))' "$RUNNER_TEMP/guest-test-build.jsonl")
          docker run --rm --privileged --cgroupns=host --init \
            -v "$PWD:$PWD:ro" -w "$PWD" ubuntu:24.04 /bin/sh -ec '
              test -f /sys/fs/cgroup/cgroup.controllers
              printf "+cpu +memory\n" > /sys/fs/cgroup/cgroup.subtree_control
              exec "$1" --exact guest::tests::detached_descendants_survive_and_exec_cgroups_are_reaped --ignored --nocapture
            ' sh "$guest_test"
      - run: cargo run --locked --bin vm-runnerd -- check --config examples/vm-runner.yaml
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      - run: cargo machete
      - run: cargo deny --all-features --locked check

  image:
    name: Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash ci/build-release.sh '${{ matrix.target }}'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and smoke-test the native image without pushing
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ./*.sha256)
          mkdir image-context
          cp Dockerfile image-context/
          cp 'dist/vm-runnerd-${{ matrix.target }}' image-context/vm-runnerd
          docker buildx build --platform 'linux/${{ matrix.arch }}' --load \
            --tag vm-runner:ci image-context
          [[ "$(docker image inspect vm-runner:ci --format '{{.Config.User}}')" == '1000:1000' ]]
          docker run --rm vm-runner:ci --help
          docker run --rm -v "$PWD/examples:/config:ro" vm-runner:ci check --config /config/vm-runner.yaml

  conformance:
    name: OTLP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZO_ROOT_USER_EMAIL: ci@example.com
      ZO_ROOT_USER_PASSWORD: 'Conformance-Only-123!'
    services:
      openobserve:
        image: openobserve/openobserve:v1.0.4@sha256:d4a878fac1f6c56003764f7f2a1625668917388f167e222c8c810de3f54c56ba
        env:
          ZO_ROOT_USER_EMAIL: ci@example.com
          ZO_ROOT_USER_PASSWORD: 'Conformance-Only-123!'
          ZO_TELEMETRY: 'false'
        ports:
          - 5080:5080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: cargo build --locked --bin vm-runnerd
      # GitHub services cannot supply the `run` argument required by Quickwit's entrypoint.
      - name: Start Quickwit service
        run: >-
          docker run --detach --name conformance-quickwit
          --publish 127.0.0.1:7280:7280 --publish 127.0.0.1:7281:7281
          --env QW_ENABLE_OTLP_ENDPOINT=true
          quickwit/quickwit:0.8.2@sha256:363ff56ce45614e46eba1c308e420f56a9f2fd8ab5788cbca0ec6b68a2e0ef92 run
      - name: Assert HTTP/protobuf and gRPC traces in search
        run: python3 ci/otlp_conformance.py --artifacts "$RUNNER_TEMP/conformance"
      - name: Service evidence and cleanup
        if: always()
        run: |
          docker logs '${{ job.services.openobserve.id }}'
          if docker container inspect conformance-quickwit >/dev/null 2>&1; then
            docker logs conformance-quickwit
            docker rm --force conformance-quickwit
          fi
          if test -d "$RUNNER_TEMP/conformance"; then
            find "$RUNNER_TEMP/conformance" -name '*.log' -exec cat {} +
          fi
