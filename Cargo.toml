[package]
name = "vm-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/vm-runner"

[dependencies]
aws-lc-rs = "1.18.1"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
hickory-proto = "0.26.3"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ipnet = { version = "2.12.2", features = ["serde"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"
uuid = "1.23.0"
url = "2.5.8"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-client", "trace", "logs", "internal-logs", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = "0.33.0"
poem = "3.1.12"
poem-openapi = "5.1.16"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[target.'cfg(unix)'.dependencies]
cap-std = "3.4.5"
rustix = { version = "1.1.5", features = ["fs"] }
nix = { version = "0.30.1", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7.2"
# Keep vsock's nix aligned with poem until poem supports nix 0.31.
vsock = "=0.5.2"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
poem = { version = "3.1.12", features = ["test"] }
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"

[lints.rust]
# Keep unsafe denied workspace-wide (and existing crate-local forbids intact), permitting
# only broker-host's site-scoped, verified trusted-file cwasm deserialization call.
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Span guards, mutexes, and RefCell borrows held across `.await` corrupt trace parenting or
# deadlock. `clippy.toml` names the tracing guard types for `await_holding_invalid_type`.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Discarding a failure's cause at the site that discards it is the most common defect class in
# this repository. A site that legitimately drops one takes a scoped `#[allow]` with a reason.
map_err_ignore = "deny"
let_underscore_must_use = "deny"
# A panic in `dekopond` drops a live chat session and one in `dekopon-brokerd` takes the only
# authorization path down with it. `expect_used` follows once the poisoned-mutex policy is settled.
unwrap_used = "deny"
# `Arc::clone(&x)`/`Rc::clone(&x)` at the callsite distinguishes a refcount bump from a deep copy
# of the pointee, which matters where the pointee is a session, a policy set, or a component.
clone_on_ref_ptr = "deny"
