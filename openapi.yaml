openapi: 3.0.0
info:
  title: vm-runner
  version: 0.1.1
servers: []
tags: []
paths:
  /v1/sessions:
    post:
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/Create'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SessionBody'
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SessionBody'
        '409':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/NotExecuted'
        '401':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Refusal'
        '503':
          description: ''
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /healthz:
    get:
      responses:
        '200':
          description: ''
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /v1/whoami:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Refusal'
components:
  schemas:
    Conflict:
      type: object
      title: Conflict
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ConflictCode'
    ConflictCode:
      type: string
      enum:
      - session_profile_conflict
    Create:
      type: object
      title: Create
      required:
      - profile
      properties:
        profile:
          type: string
        name:
          type: string
    Failure:
      type: string
      enum:
      - quota
      - bad_profile
      - bad_name
    Identity:
      type: object
      title: Identity
      required:
      - subject
      - quota
      properties:
        subject:
          type: string
        quota:
          $ref: '#/components/schemas/Quota'
    NotExecuted:
      type: object
      title: NotExecuted
      required:
      - outcome
      - reason
      properties:
        outcome:
          $ref: '#/components/schemas/NotExecutedOutcome'
        reason:
          $ref: '#/components/schemas/Failure'
    NotExecutedOutcome:
      type: string
      enum:
      - not_executed
    Quota:
      type: object
      title: Quota
      required:
      - maxSessions
      properties:
        maxSessions:
          type: integer
          format: uint32
    Reason:
      type: string
      enum:
      - audience
      - issuer
      - expired
      - not_yet_valid
      - signature
      - unknown_subject
      - malformed
    Refusal:
      type: object
      title: Refusal
      required:
      - error
      - reason
      properties:
        error:
          type: string
        reason:
          $ref: '#/components/schemas/Reason'
    SessionBody:
      type: object
      title: SessionBody
      required:
      - sessionId
      - name
      - profile
      - shape
      - state
      properties:
        sessionId:
          type: string
        name:
          type: string
        profile:
          type: string
        shape:
          type: string
        state:
          $ref: '#/components/schemas/SessionState'
    SessionState:
      type: string
      enum:
      - pending
